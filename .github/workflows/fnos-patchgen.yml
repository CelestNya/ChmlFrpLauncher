name: fnOS Patch Generator

# 从 patcher 分支自动生成 fnOS 前端 patch，并开 PR 合入 main。
#
# 触发：push 到 patcher 分支（或手动 dispatch）。
# 流程：
#   1. checkout patcher（fetch-depth 0 获取全历史）
#   2. 同步上游最新 develop 作为 patch 生成基线（fork main 的 src/ 与其一致）
#   3. 跑 fnos-pack/gen-patch.sh 生成两个 patch（diff 上游 develop 基线）
#   4. 基于 origin/main 建临时分支，只提交 patches/ + gen-patch.sh（不含 src/）
#   5. push 临时分支 → 开 PR：临时分支 → main（人工 review 后合并）
#
# 为什么基于 origin/main 建临时分支：
#   patcher 分支含 src/ 的侵入式改动，若直接 PR 会带出 src/ 改动破坏 0 侵入。
#   临时分支从 origin/main 检出，只取 patch 产物，PR 仅含 patches/ 目录变化。

on:
  push:
    branches:
      - patcher
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# D1：并发防护——patcher 连续 push 触发多个 run 时只保留最新（旧 run 取消），
# 避免乱序 force push 与 PR 创建 TOCTOU（422 红 run 曾真实发生）
concurrency:
  group: fnos-patchgen
  cancel-in-progress: true

jobs:
  gen-patch:
    name: Generate fnOS patches & PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout patcher (full history)
        uses: actions/checkout@v4
        with:
          ref: patcher
          fetch-depth: 0

      - name: Sync upstream v0.7.5 baseline
        run: |
          git remote add upstream https://github.com/TechCat-Team/ChmlFrpLauncher.git
          # v0.7.5 tag 用 refspec 映射到独立 ref（避免与 fork 自带 tag 冲突）
          git fetch upstream refs/tags/v0.7.5:refs/remotes/upstream/v0.7.5
          git fetch origin main
          # D3：不变式 CI 化——fork main 的 src/ 必须与上游 v0.7.5 一致（0 侵入），
          # 不一致则 patch 基线错乱，显式失败而非靠人工维持
          if ! git diff --quiet upstream/v0.7.5 origin/main -- src/; then
            echo "❌ fork main 的 src/ 与上游 v0.7.5 不一致，请先同步 main（rebase --onto）" >&2
            exit 1
          fi
          echo "上游 v0.7.5 基线: $(git rev-parse --short upstream/v0.7.5)"
          echo "fork main 基线:   $(git rev-parse --short origin/main)"

      - name: Generate patches
        run: |
          BASE=upstream/v0.7.5 bash fnos-pack/gen-patch.sh
          echo "=== patch 变更 ==="
          git status --short fnos-pack/patches/

      - name: Open PR with patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # patch 无变化则跳过
          PATCH_DIR=fnos-pack/patches
          if git diff --quiet origin/main -- "$PATCH_DIR" fnos-pack/gen-patch.sh; then
            echo "✅ patch 无变化，无需 PR"
            exit 0
          fi

          # 基于 origin/main 建临时分支，携带 Generate patches 步骤生成的 patch
          # 切分支会覆盖工作树，先把生成物复制到 /tmp，切完再恢复
          mkdir -p /tmp/genout
          cp "$PATCH_DIR"/fnos-*.patch /tmp/genout/
          cp fnos-pack/gen-patch.sh /tmp/genout/
          # 丢弃工作树其余改动，避免切换分支被挡
          git checkout -- . 2>/dev/null || true
          git clean -fd 2>/dev/null || true
          BRANCH="fnos-patch"
          git branch -D "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH" origin/main
          # 恢复生成的 patch 到新分支并提交
          mkdir -p "$PATCH_DIR"
          cp /tmp/genout/fnos-*.patch "$PATCH_DIR/"
          cp /tmp/genout/gen-patch.sh fnos-pack/gen-patch.sh
          git add "$PATCH_DIR" fnos-pack/gen-patch.sh
          git -c user.name='fnos-bot' -c user.email='fnos-bot@users.noreply.github.com' \
            commit -m "chore(fnos): 自动生成 fnOS patch（来自 patcher 分支）"

          git push origin "$BRANCH" --force

          # 若同源 PR 已存在则刷新 body 后跳过（幂等；--head 需带仓库前缀否则匹配不到）
          PR_BODY="由 patcher 分支自动生成的 fnOS 前端 patch 更新。来源: patcher@$(git rev-parse --short patcher)，基线: 上游 v0.7.5@$(git rev-parse --short upstream/v0.7.5)。仅改动 fnos-pack/patches/（+ gen-patch.sh），不涉及 src/。请 review 后合并。"
          EXISTING=$(gh pr list --repo CelestNya/ChmlFrpLauncher --head "$BRANCH" --state open --json number -q '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            # D2：body 曾永远停留在首次创建模板（基线 SHA 过期误导 reviewer），
            # 已存在时刷新 body 再退出
            echo "已存在 PR #$EXISTING，刷新 body 后跳过创建"
            gh pr edit "$EXISTING" --repo CelestNya/ChmlFrpLauncher --body "$PR_BODY"
            exit 0
          fi
          # 用 REST API 创建 PR（GraphQL createPullRequest 对 GITHUB_TOKEN 有
          # integration 限制，REST POST /pulls 仅需 pull-requests: write）
          # D1b：422 = 并发 run 已抢先创建（concurrency 之外的 TOCTOU 兜底）→ 视为成功
          set +e
          PR_OUT=$(gh api repos/CelestNya/ChmlFrpLauncher/pulls \
            -f "title=chore(fnos): 更新 fnOS patch（自动生成）" \
            -f "head=$BRANCH" \
            -f "base=main" \
            -f "body=$PR_BODY" \
            --jq '.html_url' 2>&1)
          PR_CODE=$?
          set -e
          if [ $PR_CODE -ne 0 ]; then
            if echo "$PR_OUT" | grep -q "422"; then
              echo "⚠️ PR 创建返回 422（并发 run 已创建），视为成功"
              exit 0
            fi
            echo "❌ 创建 PR 失败: $PR_OUT" >&2
            exit 1
          fi
          echo "✅ 已创建 PR: $PR_OUT"
