name: fnOS Build

# 构建 ChmlFrp fnOS 版 .fpk（双架构）。
# 触发：打 tag v* 时与桌面版并行；也可手动触发。
# 流程：patch → 前端构建 → 注入 shim → daemon 编译（x86_64 原生 + aarch64 交叉）→ 组装 .fpk
# 桌面版 workflow（release.yml）不动。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-fnos:
    name: fnOS .fpk (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    # aarch64 musl 链接器（zig cc + wrapper；x86_64 不使用，无副作用）
    env:
      CC_aarch64_unknown_linux_musl: "zigcc"
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: "zigcc"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fnos-daemon/target
          key: ${{ runner.os }}-fnos-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fnos-${{ matrix.arch }}-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            musl-tools \
            pkg-config \
            patch \
            python3-pil \
            gcc-aarch64-linux-gnu

      # aarch64 musl 交叉链接器：zig cc（zig 自带 musl libc，GitHub release 下载稳定；
      # musl.cc 预编译工具链在 runner 上超时）。apt 的 gcc-aarch64-linux-gnu 是 gnu 交叉，
      # 不满足 daemon 的 musl 静态编译要求（fnOS glibc 2.36）。
      - name: Setup zig (aarch64 musl linker)
        if: matrix.arch == 'aarch64'
        run: |
          # zig 0.12.1 + gcc 兼容 wrapper：
          # ring 探测用 `zig -E`（带 rustc 风格 -target 三字段，zig 不认），
          # wrapper 把 target 参数转成 zig 格式（aarch64-unknown-linux-musl → aarch64-linux-musl）
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.12.1/zig-linux-x86_64-0.12.1.tar.xz
          tar xf /tmp/zig.tar.xz -C /tmp
          /tmp/zig-linux-x86_64-0.12.1/zig version

          ZIG_BIN=/tmp/zig-linux-x86_64-0.12.1/zig
          mkdir -p /tmp/zig-wrapper
          # wrapper：仅把首个 target 位置参数换成 zig 格式（路径参数不受影响）
          WRAPPER_B64=""
          echo "$WRAPPER_B64" | base64 -d > /tmp/zig-wrapper/zigcc
          chmod +x /tmp/zig-wrapper/zigcc
          /tmp/zig-wrapper/zigcc -v >/dev/null 2>&1 && echo "zigcc wrapper OK"
          echo "/tmp/zig-wrapper" >> "$GITHUB_PATH"

      # 官方 fnpack 打包工具（build-fpk.sh 内部也有自动下载兜底）
      - name: Setup fnpack
        uses: mengzhuo/setup-fnpack@v1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # apply-patches.sh 产出 dist-fnos/（patch + tsc + vite build + shim 注入）
      - name: Build frontend (patch + shim)
        run: |
          bash fnos-pack/apply-patches.sh

      - name: Build .fpk + update bundle
        run: |
          bash fnos-pack/build-fpk.sh --arch ${{ matrix.arch }} --skip-frontend --bundle

      - name: Upload .fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: chmlfrp-fpk-${{ matrix.arch }}
          path: dist-fpk/*.fpk
          if-no-files-found: error

      - name: Upload update bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: chmlfrp-fnos-bundle-${{ matrix.arch }}
          path: dist-fpk/chmlfrp-fnos-*.tar.gz
          if-no-files-found: error

  # 把更新 bundle 附加到 GitHub Release（daemon 自更新源 /api/update/check 拉取）
  attach-bundles:
    name: Attach fnOS update bundles to Release
    needs: build-fnos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all fnOS bundles
        uses: actions/download-artifact@v4
        with:
          pattern: chmlfrp-fnos-bundle-*
          merge-multiple: true
          path: bundles

      - name: Attach bundles to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for f in bundles/chmlfrp-fnos-*.tar.gz; do
            gh release upload "$GITHUB_REF_NAME" "$f" --clobber
            echo "已附加: $(basename "$f")"
          done
