name: fnOS Build

# 构建 ChmlFrp fnOS 版 .fpk（分支矩阵拓扑，2026-08-15）。
# 组合模型：main（src 0 侵入）+ adapter/<ver> 分支（fnos-api 契约）+ patch 分支（业务实现）。
# src 基线由 adapter manifest 声明的 upstream.ref 确定（「src 根据 adapter 版本确定」）。
#
# 触发：
#   - workflow_dispatch：选 adapter 分支 + patch 分支 + 架构（版本矩阵构建）
#   - push main：默认组合（adapter/v0.7.5 + patch）回归构建
#   - push patch 分支：patch 业务变更 → 组合验证构建（patch 依赖校验 CI 化）
#
# 流程：组合 checkout → 0 侵入验证（src == adapter 声明的上游 ref）→ patch 依赖校验
#      （requires.api ≤ adapter apiVersion）→ apply-patches → build-fpk
# 桌面版 workflow（release.yml）不动。

on:
  push:
    branches: [main, patch]
  workflow_dispatch:
    inputs:
      adapter:
        description: adapter 分支（决定 src 基线 + API 契约版本）
        type: choice
        options:
          - adapter/v0.7.5
        default: adapter/v0.7.5
      patch:
        description: patch 分支（fnOS 业务实现）
        type: choice
        options:
          - patch
        default: patch
      arch:
        description: 目标架构
        type: choice
        options:
          - x86_64
          - aarch64
        default: x86_64

# D4：最小权限——构建只需读仓库；attach-bundles 单独声明 write（上传 release asset）
permissions:
  contents: read

jobs:
  build-fnos:
    name: fnOS .fpk (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    # aarch64 musl 链接器（musl.cc 工具链；x86_64 不使用，无副作用）
    env:
      CC_aarch64_unknown_linux_musl: "aarch64-linux-musl-gcc"
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: "aarch64-linux-musl-gcc"

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 组合：从 adapter/patch 分支拉对应目录进工作区（分支矩阵核心）
      - name: Compose adapter + patch branches
        run: |
          set -euo pipefail
          ADAPTER="${{ github.event.inputs.adapter || 'adapter/v0.7.5' }}"
          PATCH="${{ github.event.inputs.patch || 'patch' }}"
          echo "组合: adapter=$ADAPTER + patch=$PATCH"
          git fetch origin "$ADAPTER" "$PATCH"
          git checkout "$ADAPTER" -- fnos-api/
          git checkout "$PATCH" -- fnos-pack/ fnos-daemon/ fnos-shim/

          # src 基线由 adapter 声明的 upstream.ref 确定
          SRC_REF=$(python3 -c "import json; print(json.load(open('fnos-api/adapters/v0.7.5/manifest.json'))['upstream']['ref'])")
          echo "adapter 声明 src 基线: $SRC_REF"
          git remote add upstream https://github.com/TechCat-Team/ChmlFrpLauncher.git 2>/dev/null || true
          git fetch upstream "refs/tags/$SRC_REF:refs/remotes/upstream/$SRC_REF"

          # 0 侵入不变式：main 的 src/ 必须与 adapter 声明的上游 ref 一致
          if ! git diff --quiet "upstream/$SRC_REF" -- src/; then
            echo "❌ main 的 src/ 与 adapter 声明的上游 $SRC_REF 不一致（0 侵入被破坏）" >&2
            exit 1
          fi
          echo "✅ 0 侵入验证通过（src == upstream/$SRC_REF）"

      # patch 依赖校验 CI 化：requires.api ≤ adapter apiVersion + 命令面/uiConfig 覆盖
      - name: Verify adapter coverage & patch deps
        run: |
          bash fnos-api/verify-adapter.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fnos-daemon/target
          key: ${{ runner.os }}-fnos-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fnos-${{ matrix.arch }}-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            musl-tools \
            pkg-config \
            patch \
            python3-pil

      # aarch64 musl 交叉链接器：zig cc（zig 自带 musl libc，GitHub release 下载稳定；
      # musl.cc 预编译工具链在 runner 上超时）。apt 的 gcc-aarch64-linux-gnu 是 gnu 交叉，
      # 不满足 daemon 的 musl 静态编译要求（fnOS glibc 2.36）。
      - name: Cache aarch64 musl toolchain
        if: matrix.arch == 'aarch64'
        id: musl-cache
        uses: actions/cache@v4
        with:
          path: /tmp/aarch64-linux-musl-cross
          key: musl-cross-aarch64-v0.0.1

      - name: Setup aarch64 musl toolchain
        if: matrix.arch == 'aarch64'
        run: |
          if [ ! -x /tmp/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc ]; then
            curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 15 -o /tmp/aarch64-musl.tgz \
              https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/aarch64-linux-musl-cross.tgz
            tar xzf /tmp/aarch64-musl.tgz -C /tmp
          fi
          /tmp/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc --version | head -1
          echo "/tmp/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"

      # 官方 fnpack 打包工具（build-fpk.sh 内部也有自动下载兜底）
      - name: Setup fnpack
        uses: mengzhuo/setup-fnpack@v1

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # apply-patches.sh 产出 dist-fnos/（patch + tsc + vite build + shim 注入）
      - name: Build frontend (patch + shim)
        run: |
          bash fnos-pack/apply-patches.sh

      - name: Build .fpk + update bundle
        run: |
          bash fnos-pack/build-fpk.sh --arch ${{ matrix.arch }} --skip-frontend --bundle

      - name: Upload .fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: chmlfrp-fpk-${{ matrix.arch }}
          path: dist-fpk/*.fpk
          if-no-files-found: error

      - name: Upload update bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: chmlfrp-fnos-bundle-${{ matrix.arch }}
          path: dist-fpk/chmlfrp-fnos-*.tar.gz
          if-no-files-found: error

  # 把更新 bundle 附加到 GitHub Release（daemon 自更新源 /api/update/check 拉取）
  attach-bundles:
    name: Attach fnOS update bundles to Release
    needs: build-fnos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all fnOS bundles
        uses: actions/download-artifact@v4
        with:
          pattern: chmlfrp-fnos-bundle-*
          merge-multiple: true
          path: bundles

      - name: Attach bundles to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for f in bundles/chmlfrp-fnos-*.tar.gz; do
            gh release upload "$GITHUB_REF_NAME" "$f" --clobber
            echo "已附加: $(basename "$f")"
          done
