name: fnOS Upstream Follow

# 自动跟随上游 v0.7.5 tag（LTS 基线，2026-08-15 用户决策：先着力开发 0.7.5 release）。
# 基线冻结在 v0.7.5 后，tag 不可变 → 本 workflow 常态静默退出；
# 仅当上游 force 更新 v0.7.5 或发 hotfix 时才感知（保留自动同步能力）。
# develop 线暂停跟随（0.8.0 WIP 与当前基线无关，adapter 已登记命令面一致）。
#
# 触发：schedule 每 6 小时 + 手动 dispatch。
# 流程（上游 v0.7.5 有更新时）：
#   1. main merge 新上游（main 的 src/ 0 侵入 → 天然无冲突快进，fork 附加文件保留）
#   2. 从 main 建 sync-upstream 分支
#   3. gen-patch.sh（BASE=新上游）→ 自检 patch 可应用
#   4. apply-patches + build-fpk（src/ = 新上游干净 + patch 应用）→ artifact
#   5. 自动开 PR「同步上游到 <sha>」（main 基线更新 + patch 更新，供人工 review 合并）
# 冲突路径（上游改了 patch 涉及文件）：
#   gen-patch 自检失败 → 不硬解，自动开 issue 报告冲突文件，人工处理
#
# 为什么 main merge 上游天然无冲突：
#   main 的 src/ == 上游 v0.7.5（0 侵入不变式），merge 新上游 = src/ 快进；
#   fork 附加文件（fnos-daemon/ fnos-shim/ fnos-pack/ docs/）与上游无交集。

on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小时
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: fnos-upstream-follow
  cancel-in-progress: true

jobs:
  follow-upstream:
    name: Follow upstream & build fpk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main (full history)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream & compare SHA
        id: upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/TechCat-Team/ChmlFrpLauncher.git
          # v0.7.5 tag 用 refspec 映射到独立 ref（避免与 fork 自带 tag 冲突）
          git fetch upstream refs/tags/v0.7.5:refs/remotes/upstream/v0.7.5
          git fetch origin main

          NEW_SHA=$(git rev-parse upstream/v0.7.5)
          OLD_SHA=$(git rev-parse origin/main)
          echo "上游 v0.7.5: $NEW_SHA"
          echo "fork main:   $OLD_SHA"

          # 上游是否领先 main（有未同步提交）
          if git merge-base --is-ancestor "$OLD_SHA" "$NEW_SHA"; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "上游有新提交，开始同步"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "✅ 上游无新提交（或 main 已含最新上游），静默退出"
          fi

      - name: Merge upstream into main, create sync branch
        if: steps.upstream.outputs.has_updates == 'true'
        run: |
          set -euo pipefail
          # main 的 src/ == 旧上游（0 侵入），merge 新上游 = src/ 快进，fork 附加文件保留
          git merge --no-edit upstream/v0.7.5 2>&1 | tail -3 || {
            echo "❌ main merge 上游失败（0 侵入不变式不应冲突）" >&2
            exit 1
          }
          # 0 侵入验证：merge 后 main 的 src/ 必须 == 新上游
          if ! git diff --quiet upstream/v0.7.5 -- src/; then
            echo "❌ merge 后 main 的 src/ 与上游 v0.7.5 不一致（0 侵入被破坏）" >&2
            exit 1
          fi
          # 建同步分支（含 fork 附加文件 + 新上游 src/）
          git checkout -b sync-upstream
          echo "同步基线: $(git rev-parse --short HEAD)"

      - name: Generate patches (BASE = new upstream)
        if: steps.upstream.outputs.has_updates == 'true'
        run: |
          set -euo pipefail
          # sync-upstream 的 src/ == 新上游，gen-patch diff 新上游 → 纯 fnOS 改动
          if ! BASE=upstream/v0.7.5 bash fnos-pack/gen-patch.sh; then
            echo "❌ patch 生成/自检失败——上游改了 patch 涉及文件，走冲突分支" >&2
            exit 2
          fi
          echo "=== patch 变更 ==="
          git status --short fnos-pack/patches/

      - name: Detect patch conflict & open issue
        if: steps.upstream.outputs.has_updates == 'true' && failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # gen-patch 失败 = 上游改动与 fnOS patch 冲突（或 E6 未登记）
          UP_SHA=$(git rev-parse --short upstream/v0.7.5)
          CONFLICT_FILES=$(git diff --name-only "origin/main" upstream/v0.7.5 -- src/ || true)
          BODY=$(printf '上游 v0.7.5@%s 更新导致 fnOS patch 生成失败，无法自动同步，需要人工处理。\n上游本次改动 src/ 文件（命中 patch 清单的需重点看）: %s\n处理步骤:\n1. 本地 git fetch upstream\n2. main: git merge upstream/v0.7.5（src/ 快进，无冲突）\n3. patcher: git rebase --onto main origin/main patcher 解冲突（fnOS 改动 vs 上游语义合并）\n4. push patcher → patchgen CI 重生成 patch\n5. 手动触发本 workflow 恢复自动跟随' "$UP_SHA" "$CONFLICT_FILES")
          EXISTING=$(gh issue list --repo CelestNya/ChmlFrpLauncher \
            --search "上游 v0.7.5@${UP_SHA} patch 冲突" --state open --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "已存在冲突 issue #$EXISTING，刷新 body"
            gh issue edit "$EXISTING" --body "$BODY"
          else
            gh issue create --repo CelestNya/ChmlFrpLauncher \
              --title "⚠️ 上游 v0.7.5@${UP_SHA} 导致 fnOS patch 冲突，需人工同步" \
              --body "$BODY"
          fi
          echo "✅ 已上报冲突 issue（不自动硬解，人工处理）"

      - name: Build fpk (no conflict path)
        if: steps.upstream.outputs.has_updates == 'true' && !failure()
        run: |
          set -euo pipefail
          # sync-upstream 的 src/ == 新上游（干净），apply-patches 应用 patch 后构建
          OUTPUT_DIR="$GITHUB_WORKSPACE/dist-fnos" bash fnos-pack/apply-patches.sh
          rustup target add x86_64-unknown-linux-musl
          bash fnos-pack/build-fpk.sh --skip-frontend
          ls -la dist-fpk/

      - name: Upload fpk artifacts
        if: steps.upstream.outputs.has_updates == 'true' && !failure()
        uses: actions/upload-artifact@v4
        with:
          name: chmlfrp-fpk-upstream-sync
          path: |
            dist-fpk/*.fpk
            dist-fpk/*.tar.gz
          retention-days: 14

      - name: Open sync PR
        if: steps.upstream.outputs.has_updates == 'true' && !failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # sync-upstream = main 基线更新（新上游 src/）+ patch 重生成，PR 合入 main
          UP_SHA=$(git rev-parse --short upstream/v0.7.5)
          git add fnos-pack/patches/ fnos-pack/gen-patch.sh
          git -c user.name='fnos-bot' -c user.email='fnos-bot@users.noreply.github.com' \
            commit -m "chore(fnos): 同步上游 v0.7.5@${UP_SHA}（patch 重生成）" 2>/dev/null || echo "无 patch 变更，仅基线更新"
          git push origin sync-upstream --force

          PR_BODY=$(printf '自动同步上游 v0.7.5@%s。\n- main 基线更新到上游最新（src/ 0 侵入不变式保持，merge 验证通过）\n- fnOS patch 已针对新上游重生成（无冲突路径）\n- fpk 产物见 workflow artifact（chmlfrp-fpk-upstream-sync）\n- 上游变更摘要:\n%s' "$UP_SHA" "$(git log --oneline "origin/main..upstream/v0.7.5" | head -20)")
          EXISTING=$(gh pr list --repo CelestNya/ChmlFrpLauncher --head sync-upstream --state open --json number -q '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            echo "已存在 PR #$EXISTING，刷新 body"
            gh pr edit "$EXISTING" --repo CelestNya/ChmlFrpLauncher --body "$PR_BODY"
            exit 0
          fi
          set +e
          PR_OUT=$(gh api repos/CelestNya/ChmlFrpLauncher/pulls \
            -f "title=chore(fnos): 同步上游 v0.7.5@${UP_SHA}" \
            -f "head=sync-upstream" \
            -f "base=main" \
            -f "body=$PR_BODY" \
            --jq '.html_url' 2>&1)
          PR_CODE=$?
          set -e
          if [ $PR_CODE -ne 0 ]; then
            if echo "$PR_OUT" | grep -q "422"; then
              echo "⚠️ PR 创建 422（并发），视为成功"
              exit 0
            fi
            echo "❌ 创建 PR 失败: $PR_OUT" >&2
            exit 1
          fi
          echo "✅ 已创建 PR: $PR_OUT"
